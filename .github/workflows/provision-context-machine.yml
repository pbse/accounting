name: Provision context machine in standby
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CONTEXT_MACHINE_ENABLED: ${{ vars.CONTEXT_MACHINE_ENABLED || 'true' }}
      CONTEXT_MACHINE_TOKEN: ${{ secrets.CONTEXT_MACHINE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require explicit standby mode and service authentication
        run: node scripts/deploy-context-machine.mjs --provision-disabled --check
      - run: npm ci
      - name: Deploy the private Worker and real CLI image without starting research
        run: node scripts/deploy-context-machine.mjs --provision-disabled --production

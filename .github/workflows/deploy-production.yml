name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Documentation changes alone change nothing deployed.
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
  # To find the merged pull request and its CI run.
  actions: read
  pull-requests: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      VITE_WORKOS_API_HOSTNAME: ${{ vars.WORKOS_API_HOSTNAME }}
      VITE_AUTH_SESSION: ${{ vars.AUTH_SESSION }}
      AUTH_SESSION: ${{ vars.AUTH_SESSION }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_ORGANIZATION_ID: ${{ vars.WORKOS_ORGANIZATION_ID }}
      WORKOS_ISSUER: ${{ vars.WORKOS_ISSUER }}
      PLATFORM_ORGANIZATION_ID: ${{ vars.PLATFORM_ORGANIZATION_ID }}
      VITE_PLATFORM_ORGANIZATION_ID: ${{ vars.PLATFORM_ORGANIZATION_ID }}
      FRONTEND_ORIGIN: ${{ vars.PRODUCTION_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      TEXT_SCANNER_URL: ${{ vars.TEXT_SCANNER_URL }}
      UPLOAD_SCAN_HOST: ${{ vars.UPLOAD_SCAN_HOST }}
      UPLOAD_SCAN_KEY: ${{ secrets.UPLOAD_SCAN_KEY }}
      EMAIL_INTAKE_ADDRESS: ${{ vars.EMAIL_INTAKE_ADDRESS }}
      EMAIL_INTAKE_KEY: ${{ secrets.EMAIL_INTAKE_KEY }}
      SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
      QBO_CLIENT_ID: ${{ vars.QBO_CLIENT_ID }}
      QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
      QBO_REDIRECT_URI: ${{ vars.QBO_REDIRECT_URI }}
      QBO_WEBHOOK_VERIFIER: ${{ secrets.QBO_WEBHOOK_VERIFIER }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      QBO_PRODUCTION_CLIENT_ID: ${{ vars.QBO_PRODUCTION_CLIENT_ID }}
      QBO_PRODUCTION_CLIENT_SECRET: ${{ secrets.QBO_PRODUCTION_CLIENT_SECRET }}
      QBO_PRODUCTION_REDIRECT_URI: ${{ vars.QBO_PRODUCTION_REDIRECT_URI }}
      XERO_CLIENT_ID: ${{ vars.XERO_CLIENT_ID }}
      XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
      XERO_REDIRECT_URI: ${{ vars.XERO_REDIRECT_URI }}
      XERO_WEBHOOK_KEY: ${{ secrets.XERO_WEBHOOK_KEY }}
      PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      CONTEXT_MACHINE_MODEL: ${{ vars.CONTEXT_MACHINE_MODEL }}
      CONTEXT_MACHINE_PROFILES: ${{ vars.CONTEXT_MACHINE_PROFILES }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE }}
      CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH_MODE }}
      CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT }}
      CLAUDE_REASONING_EFFORT: ${{ vars.CLAUDE_REASONING_EFFORT }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
      LLM_REASONING_EFFORTS: ${{ vars.LLM_REASONING_EFFORTS }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      LLM_MODELS: ${{ vars.LLM_MODELS }}
      CONTEXT_MACHINE_TOKEN: ${{ secrets.CONTEXT_MACHINE_TOKEN }}
      CONTEXT_MACHINE_DATABASE_URL: ${{ secrets.CONTEXT_MACHINE_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
      OPERATIONS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QBO_SANDBOX_REALM_ID: ${{ vars.QBO_SANDBOX_REALM_ID }}
      QBO_SANDBOX_ENTITY: ${{ vars.QBO_SANDBOX_ENTITY }}
      QBO_SANDBOX_PREPAID_ACCOUNT_ID: ${{ vars.QBO_SANDBOX_PREPAID_ACCOUNT_ID }}
      QBO_SANDBOX_EXPENSE_ACCOUNT_ID: ${{ vars.QBO_SANDBOX_EXPENSE_ACCOUNT_ID }}
      QBO_SANDBOX_ACCESS_TOKEN: ${{ secrets.QBO_SANDBOX_ACCESS_TOKEN }}
      WORKOS_AUTHKIT_DOMAIN: ${{ vars.WORKOS_AUTHKIT_DOMAIN }}
      MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS }}
      PRODUCTION_POSTING_KINDS: ${{ vars.PRODUCTION_POSTING_KINDS }}
      XERO_POSTING_KINDS: ${{ vars.XERO_POSTING_KINDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the merge's parents, and the commit the text scanner was last deployed from.
          fetch-depth: 0
      - name: The merged pull request passed CI
        # CI is not repeated here. A push is deployed only when the pull request it merged passed CI; the image and app
        # builds below then compile what was merged. Run this workflow by hand to deploy anything else.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heads="$(git rev-parse -q --verify HEAD^2 || true) $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[].head.sha' || true)"
          for head in $heads; do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$head" --limit 1 --json conclusion -q '.[0].conclusion')
            if [ "$conclusion" = success ]; then echo "CI passed for $head"; exit 0; fi
          done
          echo "::error::No passing CI run for the pull request merged in $GITHUB_SHA (heads: ${heads:-none}). Wait for CI, then run Deploy production by hand."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate context-machine configuration
        run: node scripts/deploy-context-machine.mjs --check
      - name: Check production configuration without exposing secrets
        run: |
          node --input-type=module <<'JS'
          for (const name of ['TEXT_SCANNER_URL','UPLOAD_SCAN_KEY','WORKOS_CLIENT_ID','WORKOS_ISSUER','DATABASE_URL','MIGRATION_DATABASE_URL','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','PRODUCTION_URL','VITE_WORKOS_API_HOSTNAME']) {
            if (!process.env[name]) throw new Error(`Missing production setting: ${name}`);
          }
          if (process.env.UPLOAD_SCAN_KEY.length < 32) throw new Error('UPLOAD_SCAN_KEY must contain at least 32 random characters');
          // Without UPLOAD_SCAN_HOST (e.g. on workers.dev) the edge refuses every PDF scan; set it only for a WAF-protected custom hostname.
          if (process.env.UPLOAD_SCAN_HOST && (new URL(process.env.VITE_API_BASE_URL || process.env.PRODUCTION_URL).hostname !== process.env.UPLOAD_SCAN_HOST || process.env.UPLOAD_SCAN_HOST.endsWith('.workers.dev'))) throw new Error('UPLOAD_SCAN_HOST must match the API custom hostname protected by WAF');
          const qbo = ['QBO_CLIENT_ID','QBO_CLIENT_SECRET','QBO_REDIRECT_URI'].map(name => !!process.env[name]);
          if (qbo.some(Boolean) && (!qbo.every(Boolean) || !process.env.SECRETS_KEY)) throw new Error('QBO OAuth requires all three settings and SECRETS_KEY');
          const productionQbo = ['QBO_PRODUCTION_CLIENT_ID','QBO_PRODUCTION_CLIENT_SECRET','QBO_PRODUCTION_REDIRECT_URI'].map(name => !!process.env[name]);
          if (productionQbo.some(Boolean) && (!productionQbo.every(Boolean) || !process.env.SECRETS_KEY)) throw new Error('Production QBO OAuth requires all three settings and SECRETS_KEY');
          if (!!process.env.OPENAI_API_KEY !== !!process.env.OPENAI_MODEL) throw new Error('Set both OpenAI server settings or neither');
          if (process.env.OPERATIONS_ALERT_WEBHOOK_URL) {
            let valid = false;
            try { const url = new URL(process.env.OPERATIONS_ALERT_WEBHOOK_URL); valid = url.protocol === 'https:' && !!url.hostname && !url.username && !url.password && !url.hash; } catch {}
            if (!valid) throw new Error('Operations alert webhook must be a valid HTTPS URL without embedded credentials or fragment');
          }
          if (process.env.SECRETS_KEY && !/^[0-9a-fA-F]{64}$/.test(process.env.SECRETS_KEY)) throw new Error('SECRETS_KEY must be 32 hex-encoded random bytes');
          const session = process.env.AUTH_SESSION || 'client';
          if (!['client','server'].includes(session)) throw new Error('AUTH_SESSION must be client or server');
          if (session === 'server' && (!process.env.WORKOS_API_KEY || !process.env.SECRETS_KEY)) throw new Error('AUTH_SESSION=server needs WORKOS_API_KEY and SECRETS_KEY');
          if (session === 'server' && process.env.VITE_API_BASE_URL && new URL(process.env.VITE_API_BASE_URL).origin !== new URL(process.env.PRODUCTION_URL).origin) throw new Error('AUTH_SESSION=server needs the API on the app origin: leave VITE_API_BASE_URL empty or set it to that origin');
          if (session === 'client' && [undefined, '', 'api.workos.com'].includes(process.env.VITE_WORKOS_API_HOSTNAME)) console.log('::warning::AUTH_SESSION=client with api.workos.com: WorkOS needs a custom authentication domain in production; set AUTH_SESSION=server or a custom WORKOS_API_HOSTNAME');
          if (!!process.env.WORKOS_AUTHKIT_DOMAIN !== !!process.env.MCP_RESOURCE_URL) throw new Error('Set WORKOS_AUTHKIT_DOMAIN and MCP_RESOURCE_URL together or neither');
          if (process.env.WORKOS_AUTHKIT_DOMAIN) {
            const authkit = new URL(process.env.WORKOS_AUTHKIT_DOMAIN);
            if (authkit.protocol !== 'https:' || authkit.username || authkit.password || authkit.search || authkit.hash || !['', '/'].includes(authkit.pathname)) throw new Error('WORKOS_AUTHKIT_DOMAIN must be an HTTPS origin with no path, query or credentials');
            const mcp = `${new URL(process.env.VITE_API_BASE_URL || process.env.PRODUCTION_URL).origin}/mcp`;
            if (process.env.MCP_RESOURCE_URL !== mcp) throw new Error(`MCP_RESOURCE_URL must be ${mcp}`);
          }
          if (!!process.env.EMAIL_INTAKE_ADDRESS !== !!process.env.EMAIL_INTAKE_KEY || (process.env.EMAIL_INTAKE_KEY && process.env.EMAIL_INTAKE_KEY.length < 32) || (process.env.EMAIL_INTAKE_ADDRESS && !/^[a-z0-9._-]+@[a-z0-9.-]+$/i.test(process.env.EMAIL_INTAKE_ADDRESS))) throw new Error('Email intake requires a valid routing address and a separate 32-character secret');
          for (const name of ['PRODUCTION_URL','WORKOS_ISSUER','TEXT_SCANNER_URL']) {
            if (new URL(process.env[name]).protocol !== 'https:') throw new Error(`${name} must use HTTPS`);
          }
          if (!['require','verify-ca','verify-full'].includes(new URL(process.env.DATABASE_URL).searchParams.get('sslmode'))) throw new Error('Production PostgreSQL must require TLS');
          // The firm is a session setting, which a transaction pooler would share between firms.
          if (new URL(process.env.DATABASE_URL).hostname.toLowerCase().includes('-pooler')) throw new Error('Production DATABASE_URL must use the direct endpoint, not the -pooler one');
          const migration = new URL(process.env.MIGRATION_DATABASE_URL);
          if (!['require','verify-ca','verify-full'].includes(migration.searchParams.get('sslmode')) || migration.hostname.toLowerCase().includes('-pooler')) throw new Error('MIGRATION_DATABASE_URL must be the owner on the direct endpoint and require TLS');
          JS
      - name: Apply pending migrations as the database owner
        # Production was migrated by hand before the ledger; the runner ignores this once the ledger exists.
        env:
          MIGRATION_ADOPT: infra/postgres/adopt-before-ledger.txt
        run: |
          export MIGRATION_GRANT_TO="$(node -p 'decodeURIComponent(new URL(process.env.DATABASE_URL).username)')"
          DATABASE_URL="$MIGRATION_DATABASE_URL" infra/postgres/migrate.sh
      - name: Stamp the workflow code version
        run: echo "$GITHUB_SHA" > services/backend/internal/wf/version.txt
      # Each scanner deploy saves the commit it deployed and its key's fingerprint (a hash prefix, not the key) as a new
      # cache entry, so the newest entry describes the scanner now, even when the rest of that run failed.
      - name: Fingerprint the scanner key
        id: key
        run: echo "fingerprint=$(printf %s "$UPLOAD_SCAN_KEY" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: What the scanner last received
        uses: actions/cache/restore@v4
        with:
          path: .scanner-deployed
          # Never saved under this name: the prefix restores the newest entry.
          key: production-scanner-newest
          restore-keys: production-scanner-
      - name: Did the scanner's code or key change since it was last deployed?
        id: scanner
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        # Its image holds only cmd/scanner and internal/scanning, which CI checks. A hand run always deploys it, and so
        # does a missing or unreadable record.
        run: |
          deployed=$(cat .scanner-deployed/sha 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(cat .scanner-deployed/fingerprint 2>/dev/null)" = "$FINGERPRINT" ] && [ -n "$deployed" ] && git diff --quiet "$deployed" HEAD -- services/scanner workers/scanner services/backend/cmd/scanner services/backend/internal/scanning services/backend/go.mod services/backend/go.sum package-lock.json .github/workflows/deploy-production.yml; then
            echo "Unchanged since $deployed, with the same key; not redeployed."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy isolated on-demand text scanner
        if: steps.scanner.outputs.deploy == 'true'
        run: |
          export CLOSE_SCANNER_SECRET_FILE="$(mktemp)"
          trap 'rm -f "$CLOSE_SCANNER_SECRET_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.CLOSE_SCANNER_SECRET_FILE, JSON.stringify({UPLOAD_SCAN_KEY: process.env.UPLOAD_SCAN_KEY}), {mode: 0o600});
          JS
          npx wrangler deploy -c workers/scanner/wrangler.jsonc --env production --secrets-file "$CLOSE_SCANNER_SECRET_FILE"
          mkdir -p .scanner-deployed && echo "$GITHUB_SHA" > .scanner-deployed/sha && echo "${{ steps.key.outputs.fingerprint }}" > .scanner-deployed/fingerprint
      - name: Record what the scanner has now
        if: steps.scanner.outputs.deploy == 'true'
        uses: actions/cache/save@v4
        with:
          path: .scanner-deployed
          key: production-scanner-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy private context machine before its callers
        run: node scripts/deploy-context-machine.mjs --production
      - name: Deploy code and server secrets together
        run: |
          export CLOSE_DEPLOY_SECRET_FILE="$(mktemp)"
          trap 'rm -f "$CLOSE_DEPLOY_SECRET_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const names = ['TEXT_SCANNER_URL','UPLOAD_SCAN_HOST','UPLOAD_SCAN_KEY','EMAIL_INTAKE_ADDRESS','EMAIL_INTAKE_KEY','QBO_CLIENT_ID','QBO_CLIENT_SECRET','QBO_REDIRECT_URI','QBO_WEBHOOK_VERIFIER','WORKOS_API_KEY','QBO_PRODUCTION_CLIENT_ID','QBO_PRODUCTION_CLIENT_SECRET','QBO_PRODUCTION_REDIRECT_URI','XERO_CLIENT_ID','XERO_CLIENT_SECRET','XERO_REDIRECT_URI','XERO_WEBHOOK_KEY','SECRETS_KEY','PUBLIC_APP_URL','DATABASE_URL','WORKOS_CLIENT_ID','WORKOS_ORGANIZATION_ID','WORKOS_ISSUER','PLATFORM_ORGANIZATION_ID','FRONTEND_ORIGIN','OPENAI_API_KEY','OPENAI_MODEL','OPENAI_REASONING_EFFORT','LLM_REASONING_EFFORTS','LLM_MODELS','CONTEXT_MACHINE_TOKEN','CONTEXT_MACHINE_MODEL','QBO_SANDBOX_REALM_ID','QBO_SANDBOX_ENTITY','QBO_SANDBOX_PREPAID_ACCOUNT_ID','QBO_SANDBOX_EXPENSE_ACCOUNT_ID','QBO_SANDBOX_ACCESS_TOKEN','WORKOS_AUTHKIT_DOMAIN','MCP_RESOURCE_URL','MCP_ALLOWED_ORIGINS','PRODUCTION_POSTING_KINDS','XERO_POSTING_KINDS','AUTH_SESSION'];
          writeFileSync(process.env.CLOSE_DEPLOY_SECRET_FILE, JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name] || '']))), {mode: 0o600});
          JS
          npm run deploy:production -- --secrets-file "$CLOSE_DEPLOY_SECRET_FILE" ${UPLOAD_SCAN_HOST:+--route "${UPLOAD_SCAN_HOST}/*"}
      - name: Deploy background worker with scoped server configuration
        run: |
          export CLOSE_WORKER_SECRET_FILE="$(mktemp)"
          trap 'rm -f "$CLOSE_WORKER_SECRET_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.CLOSE_WORKER_SECRET_FILE, JSON.stringify({DATABASE_URL: process.env.DATABASE_URL, SECRETS_KEY: process.env.SECRETS_KEY || '', OPENAI_API_KEY: process.env.OPENAI_API_KEY || '', OPENAI_MODEL: process.env.OPENAI_MODEL || '', OPENAI_REASONING_EFFORT: process.env.OPENAI_REASONING_EFFORT || '', LLM_REASONING_EFFORTS: process.env.LLM_REASONING_EFFORTS || '', LLM_MODELS: process.env.LLM_MODELS || '', CONTEXT_MACHINE_TOKEN: process.env.CONTEXT_MACHINE_TOKEN, CONTEXT_MACHINE_MODEL: process.env.CONTEXT_MACHINE_MODEL, OPERATIONS_ALERT_WEBHOOK_URL: process.env.OPERATIONS_ALERT_WEBHOOK_URL || '', OPERATIONS_ALERT_WEBHOOK_TOKEN: process.env.OPERATIONS_ALERT_WEBHOOK_TOKEN || '', QBO_CLIENT_ID: process.env.QBO_CLIENT_ID || '', QBO_CLIENT_SECRET: process.env.QBO_CLIENT_SECRET || '', QBO_REDIRECT_URI: process.env.QBO_REDIRECT_URI || '', QBO_PRODUCTION_CLIENT_ID: process.env.QBO_PRODUCTION_CLIENT_ID || '', QBO_PRODUCTION_CLIENT_SECRET: process.env.QBO_PRODUCTION_CLIENT_SECRET || '', QBO_PRODUCTION_REDIRECT_URI: process.env.QBO_PRODUCTION_REDIRECT_URI || '', XERO_CLIENT_ID: process.env.XERO_CLIENT_ID || '', XERO_CLIENT_SECRET: process.env.XERO_CLIENT_SECRET || '', XERO_REDIRECT_URI: process.env.XERO_REDIRECT_URI || '', PUBLIC_APP_URL: process.env.PUBLIC_APP_URL || '', UPLOAD_SCAN_KEY: process.env.UPLOAD_SCAN_KEY || '', TEXT_SCANNER_URL: process.env.TEXT_SCANNER_URL || '', WORKOS_API_KEY: process.env.WORKOS_API_KEY || ''}), {mode: 0o600});
          JS
          npx wrangler deploy -c workers/queue/wrangler.jsonc --env production --secrets-file "$CLOSE_WORKER_SECRET_FILE"
      - name: Verify production readiness
        # Retry past the 60-second private readiness cache, including a cold-start failure.
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 30 "${PRODUCTION_URL%/}/readyz"

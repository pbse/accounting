name: Transfer legacy service credentials to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a successful production deployment of route gating
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gating=$(git log -1 --format=%H -- workers/shared/llm.ts)
          deployed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-production.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha')
          test -n "$gating" && test -n "$deployed" && git merge-base --is-ancestor "$gating" "$deployed" || { echo "::error::Deploy production must succeed with route gating before transferring credentials"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Transfer only populated credentials; retain GitHub copies until cutover verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPLOAD_SCAN_KEY: ${{ secrets.UPLOAD_SCAN_KEY }}
          EMAIL_INTAKE_KEY: ${{ secrets.EMAIL_INTAKE_KEY }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_WEBHOOK_VERIFIER: ${{ secrets.QBO_WEBHOOK_VERIFIER }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          QBO_PRODUCTION_CLIENT_SECRET: ${{ secrets.QBO_PRODUCTION_CLIENT_SECRET }}
          XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
          XERO_WEBHOOK_KEY: ${{ secrets.XERO_WEBHOOK_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONTEXT_MACHINE_TOKEN: ${{ secrets.CONTEXT_MACHINE_TOKEN }}
          CONTEXT_MACHINE_DATABASE_URL: ${{ secrets.CONTEXT_MACHINE_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          OPERATIONS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QBO_SANDBOX_ACCESS_TOKEN: ${{ secrets.QBO_SANDBOX_ACCESS_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node scripts/migrate-service-credentials.mjs --production
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-role
          path: runtime-role.txt
          retention-days: 1

name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      VITE_WORKOS_API_HOSTNAME: ${{ vars.WORKOS_API_HOSTNAME }}
      VITE_AUTH_SESSION: ${{ vars.AUTH_SESSION }}
      AUTH_SESSION: ${{ vars.AUTH_SESSION }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_ORGANIZATION_ID: ${{ vars.WORKOS_ORGANIZATION_ID }}
      WORKOS_ISSUER: ${{ vars.WORKOS_ISSUER }}
      STAFF_EMAIL_DOMAIN: ${{ vars.STAFF_EMAIL_DOMAIN }}
      PLATFORM_EMAIL_FROM: ${{ vars.PLATFORM_EMAIL_FROM }}
      GEMINI_OCR_MODEL: ${{ vars.GEMINI_OCR_MODEL }}
      FRONTEND_ORIGIN: ${{ vars.STAGING_URL }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      DATABASE_RUNTIME_ROLE: ${{ vars.DATABASE_RUNTIME_ROLE }}
      TEXT_SCANNER_URL: ${{ vars.TEXT_SCANNER_URL }}
      UPLOAD_SCAN_HOST: ${{ vars.UPLOAD_SCAN_HOST }}
      EMAIL_INTAKE_ADDRESS: ${{ vars.EMAIL_INTAKE_ADDRESS }}
      CLIENT_EMAIL_ADDRESS: ${{ vars.CLIENT_EMAIL_ADDRESS }}
      CONTACT_FORWARD_ADDRESS: ${{ vars.CONTACT_FORWARD_ADDRESS }}
      QBO_CLIENT_ID: ${{ vars.QBO_CLIENT_ID }}
      QBO_REDIRECT_URI: ${{ vars.QBO_REDIRECT_URI }}
      QBO_PRODUCTION_CLIENT_ID: ${{ vars.QBO_PRODUCTION_CLIENT_ID }}
      QBO_PRODUCTION_REDIRECT_URI: ${{ vars.QBO_PRODUCTION_REDIRECT_URI }}
      XERO_CLIENT_ID: ${{ vars.XERO_CLIENT_ID }}
      XERO_REDIRECT_URI: ${{ vars.XERO_REDIRECT_URI }}
      PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      CONTEXT_MACHINE_ENABLED: ${{ vars.CONTEXT_MACHINE_ENABLED || 'true' }}
      CONTEXT_MACHINE_MODEL: ${{ vars.CONTEXT_MACHINE_MODEL }}
      CONTEXT_MACHINE_PROFILES: ${{ vars.CONTEXT_MACHINE_PROFILES }}
      CODEX_MODEL: ${{ vars.CODEX_MODEL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE }}
      CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH_MODE }}
      CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT }}
      CLAUDE_REASONING_EFFORT: ${{ vars.CLAUDE_REASONING_EFFORT }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
      LLM_REASONING_EFFORTS: ${{ vars.LLM_REASONING_EFFORTS }}

      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'api' }}
      LLM_ALLOW_UNCAPPED_OUTPUT_TOKENS: ${{ vars.LLM_ALLOW_UNCAPPED_OUTPUT_TOKENS || 'false' }}
      LLM_MODELS: ${{ vars.LLM_MODELS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QBO_SANDBOX_REALM_ID: ${{ vars.QBO_SANDBOX_REALM_ID }}
      QBO_SANDBOX_ENTITY: ${{ vars.QBO_SANDBOX_ENTITY }}
      QBO_SANDBOX_PREPAID_ACCOUNT_ID: ${{ vars.QBO_SANDBOX_PREPAID_ACCOUNT_ID }}
      QBO_SANDBOX_EXPENSE_ACCOUNT_ID: ${{ vars.QBO_SANDBOX_EXPENSE_ACCOUNT_ID }}
      WORKOS_AUTHKIT_DOMAIN: ${{ vars.WORKOS_AUTHKIT_DOMAIN }}
      MCP_RESOURCE_URL: ${{ vars.MCP_RESOURCE_URL }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS }}
      PRODUCTION_POSTING_KINDS: ${{ vars.PRODUCTION_POSTING_KINDS }}
      XERO_POSTING_KINDS: ${{ vars.XERO_POSTING_KINDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare optional AI routes and service bindings
        run: node scripts/deploy-context-machine.mjs --prepare-callers
      - name: Validate context-machine configuration
        run: node scripts/deploy-context-machine.mjs --check
      - name: Check staging configuration without exposing secrets
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['TEXT_SCANNER_URL','UPLOAD_SCAN_HOST','WORKOS_CLIENT_ID','WORKOS_ISSUER','DATABASE_RUNTIME_ROLE','MIGRATION_DATABASE_URL','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','STAGING_URL']) {
            if (!process.env[name]) throw new Error(`Missing staging setting: ${name}`);
          }
          if (new URL(process.env.VITE_API_BASE_URL || process.env.STAGING_URL).hostname !== process.env.UPLOAD_SCAN_HOST || process.env.UPLOAD_SCAN_HOST.endsWith('.workers.dev')) throw new Error('UPLOAD_SCAN_HOST must match the API custom hostname protected by WAF');
          const session = process.env.AUTH_SESSION || 'client';
          if (!['client','server'].includes(session)) throw new Error('AUTH_SESSION must be client or server');
          if (session === 'server' && process.env.VITE_API_BASE_URL && new URL(process.env.VITE_API_BASE_URL).origin !== new URL(process.env.STAGING_URL).origin) throw new Error('AUTH_SESSION=server needs the API on the app origin: leave VITE_API_BASE_URL empty or set it to that origin');
          if (session === 'client' && !process.env.VITE_WORKOS_API_HOSTNAME) throw new Error('Missing staging setting: VITE_WORKOS_API_HOSTNAME (AUTH_SESSION=client needs it)');
          if (session === 'client' && process.env.VITE_WORKOS_API_HOSTNAME === 'api.workos.com') console.log('::warning::AUTH_SESSION=client with api.workos.com: WorkOS needs a custom authentication domain in production; set AUTH_SESSION=server or a custom WORKOS_API_HOSTNAME');
          if (!!process.env.WORKOS_AUTHKIT_DOMAIN !== !!process.env.MCP_RESOURCE_URL) throw new Error('Set WORKOS_AUTHKIT_DOMAIN and MCP_RESOURCE_URL together or neither');
          if (process.env.WORKOS_AUTHKIT_DOMAIN) {
            const authkit = new URL(process.env.WORKOS_AUTHKIT_DOMAIN);
            if (authkit.protocol !== 'https:' || authkit.username || authkit.password || authkit.search || authkit.hash || !['', '/'].includes(authkit.pathname)) throw new Error('WORKOS_AUTHKIT_DOMAIN must be an HTTPS origin with no path, query or credentials');
            const mcp = `${new URL(process.env.VITE_API_BASE_URL || process.env.STAGING_URL).origin}/mcp`;
            if (process.env.MCP_RESOURCE_URL !== mcp) throw new Error(`MCP_RESOURCE_URL must be ${mcp}`);
          }
          if (process.env.EMAIL_INTAKE_ADDRESS && !/^[a-z0-9._-]+@[a-z0-9.-]+$/i.test(process.env.EMAIL_INTAKE_ADDRESS)) throw new Error('Invalid email intake address');
          // Krith's sender sends with the key of PLATFORM_EMAIL_FROM's domain, so its address is on that domain.
          if (process.env.CLIENT_EMAIL_ADDRESS) {
            if (!/^[a-z0-9._+-]+@[a-z0-9.-]+\.[a-z]+$/i.test(process.env.CLIENT_EMAIL_ADDRESS)) throw new Error('CLIENT_EMAIL_ADDRESS must be a bare address, e.g. requests@mail.example.com');
            const platform = /<([^<>]+)>\s*$/.exec(process.env.PLATFORM_EMAIL_FROM || '')?.[1] ?? (process.env.PLATFORM_EMAIL_FROM || '');
            if (platform.split('@')[1]?.toLowerCase() !== process.env.CLIENT_EMAIL_ADDRESS.split('@')[1].toLowerCase()) throw new Error("CLIENT_EMAIL_ADDRESS must be on PLATFORM_EMAIL_FROM's domain");
          }
          if (process.env.CONTACT_FORWARD_ADDRESS && !/^[a-z0-9._+-]+@[a-z0-9.-]+\.[a-z]+$/i.test(process.env.CONTACT_FORWARD_ADDRESS)) throw new Error('Invalid contact forwarding address');
          for (const name of ['STAGING_URL','WORKOS_ISSUER','TEXT_SCANNER_URL']) {
            if (new URL(process.env[name]).protocol !== 'https:') throw new Error(`${name} must use HTTPS`);
          }
          if (!/^[a-zA-Z_][a-zA-Z0-9_]{0,62}$/.test(process.env.DATABASE_RUNTIME_ROLE)) throw new Error('Invalid DATABASE_RUNTIME_ROLE');
          const migration = new URL(process.env.MIGRATION_DATABASE_URL);
          if (!['require','verify-ca','verify-full'].includes(migration.searchParams.get('sslmode')) || migration.hostname.toLowerCase().includes('-pooler')) throw new Error('MIGRATION_DATABASE_URL must be the owner on the direct endpoint and require TLS');
          JS
      - name: Check Cloudflare runtime credential metadata
        run: |
          node scripts/deploy-service.mjs edge --check
          node scripts/deploy-service.mjs queue --check
          node scripts/deploy-service.mjs scanner --check
      - name: Apply pending migrations as the database owner
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          export MIGRATION_GRANT_TO="$DATABASE_RUNTIME_ROLE"
          DATABASE_URL="$MIGRATION_DATABASE_URL" infra/postgres/migrate.sh
      - name: Stamp the workflow code version
        run: echo "$GITHUB_SHA" > services/backend/internal/wf/version.txt
      - name: Deploy isolated on-demand text scanner
        run: node scripts/deploy-service.mjs scanner
      - name: Deploy private context machine before its callers
        run: node scripts/deploy-context-machine.mjs
      - name: Deploy code while preserving Cloudflare credentials
        run: node scripts/deploy-service.mjs edge
      - name: Deploy background worker with scoped server configuration
        run: node scripts/deploy-service.mjs queue
      - name: Verify staging readiness
        # Retry past the 60-second private readiness cache, including a cold-start failure.
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 30 "${STAGING_URL%/}/readyz"

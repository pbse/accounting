name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      VITE_WORKOS_API_HOSTNAME: ${{ vars.WORKOS_API_HOSTNAME }}
      WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
      WORKOS_ORGANIZATION_ID: ${{ vars.WORKOS_ORGANIZATION_ID }}
      WORKOS_ISSUER: ${{ vars.WORKOS_ISSUER }}
      FRONTEND_ORIGIN: ${{ vars.STAGING_URL }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEXT_SCANNER_URL: ${{ vars.TEXT_SCANNER_URL }}
      UPLOAD_SCAN_HOST: ${{ vars.UPLOAD_SCAN_HOST }}
      UPLOAD_SCAN_KEY: ${{ secrets.UPLOAD_SCAN_KEY }}
      EMAIL_INTAKE_ADDRESS: ${{ vars.EMAIL_INTAKE_ADDRESS }}
      EMAIL_INTAKE_KEY: ${{ secrets.EMAIL_INTAKE_KEY }}
      SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
      QBO_CLIENT_ID: ${{ vars.QBO_CLIENT_ID }}
      QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
      QBO_REDIRECT_URI: ${{ vars.QBO_REDIRECT_URI }}
      QBO_WEBHOOK_VERIFIER: ${{ secrets.QBO_WEBHOOK_VERIFIER }}
      QBO_PRODUCTION_CLIENT_ID: ${{ vars.QBO_PRODUCTION_CLIENT_ID }}
      QBO_PRODUCTION_CLIENT_SECRET: ${{ secrets.QBO_PRODUCTION_CLIENT_SECRET }}
      QBO_PRODUCTION_REDIRECT_URI: ${{ vars.QBO_PRODUCTION_REDIRECT_URI }}
      XERO_CLIENT_ID: ${{ vars.XERO_CLIENT_ID }}
      XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
      XERO_REDIRECT_URI: ${{ vars.XERO_REDIRECT_URI }}
      PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
      OPERATIONS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QBO_SANDBOX_REALM_ID: ${{ vars.QBO_SANDBOX_REALM_ID }}
      QBO_SANDBOX_ENTITY: ${{ vars.QBO_SANDBOX_ENTITY }}
      QBO_SANDBOX_PREPAID_ACCOUNT_ID: ${{ vars.QBO_SANDBOX_PREPAID_ACCOUNT_ID }}
      QBO_SANDBOX_EXPENSE_ACCOUNT_ID: ${{ vars.QBO_SANDBOX_EXPENSE_ACCOUNT_ID }}
      QBO_SANDBOX_ACCESS_TOKEN: ${{ secrets.QBO_SANDBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check staging configuration without exposing secrets
        run: |
          node --input-type=module <<'JS'
          for (const name of ['TEXT_SCANNER_URL','UPLOAD_SCAN_HOST','UPLOAD_SCAN_KEY','WORKOS_CLIENT_ID','WORKOS_ISSUER','DATABASE_URL','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','STAGING_URL','VITE_WORKOS_API_HOSTNAME']) {
            if (!process.env[name]) throw new Error(`Missing staging setting: ${name}`);
          }
          if (process.env.UPLOAD_SCAN_KEY.length < 32) throw new Error('UPLOAD_SCAN_KEY must contain at least 32 random characters');
          if (new URL(process.env.VITE_API_BASE_URL || process.env.STAGING_URL).hostname !== process.env.UPLOAD_SCAN_HOST || process.env.UPLOAD_SCAN_HOST.endsWith('.workers.dev')) throw new Error('UPLOAD_SCAN_HOST must match the API custom hostname protected by WAF');
          const qbo = ['QBO_CLIENT_ID','QBO_CLIENT_SECRET','QBO_REDIRECT_URI'].map(name => !!process.env[name]);
          if (qbo.some(Boolean) && (!qbo.every(Boolean) || !process.env.SECRETS_KEY)) throw new Error('QBO OAuth requires all three settings and SECRETS_KEY');
          const productionQbo = ['QBO_PRODUCTION_CLIENT_ID','QBO_PRODUCTION_CLIENT_SECRET','QBO_PRODUCTION_REDIRECT_URI'].map(name => !!process.env[name]);
          if (productionQbo.some(Boolean) && (!productionQbo.every(Boolean) || !process.env.SECRETS_KEY)) throw new Error('Production QBO OAuth requires all three settings and SECRETS_KEY');
          if (!!process.env.OPENAI_API_KEY !== !!process.env.OPENAI_MODEL) throw new Error('Set both OpenAI server settings or neither');
          if (process.env.OPERATIONS_ALERT_WEBHOOK_URL) {
            let valid = false;
            try { const url = new URL(process.env.OPERATIONS_ALERT_WEBHOOK_URL); valid = url.protocol === 'https:' && !!url.hostname && !url.username && !url.password && !url.hash; } catch {}
            if (!valid) throw new Error('Operations alert webhook must be a valid HTTPS URL without embedded credentials or fragment');
          }
          if (process.env.SECRETS_KEY && !/^[0-9a-fA-F]{64}$/.test(process.env.SECRETS_KEY)) throw new Error('SECRETS_KEY must be 32 hex-encoded random bytes');
          if (!!process.env.EMAIL_INTAKE_ADDRESS !== !!process.env.EMAIL_INTAKE_KEY || (process.env.EMAIL_INTAKE_KEY && process.env.EMAIL_INTAKE_KEY.length < 32) || (process.env.EMAIL_INTAKE_ADDRESS && !/^[a-z0-9._-]+@[a-z0-9.-]+$/i.test(process.env.EMAIL_INTAKE_ADDRESS))) throw new Error('Email intake requires a valid routing address and a separate 32-character secret');
          for (const name of ['STAGING_URL','WORKOS_ISSUER','TEXT_SCANNER_URL']) {
            if (new URL(process.env[name]).protocol !== 'https:') throw new Error(`${name} must use HTTPS`);
          }
          if (!['require','verify-ca','verify-full'].includes(new URL(process.env.DATABASE_URL).searchParams.get('sslmode'))) throw new Error('Staging PostgreSQL must require TLS');
          JS
      - name: Verify migrations are already applied
        run: |
          test "$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('quickbooks_ledger_selections') IS NOT NULL AND to_regclass('client_attachments') IS NOT NULL AND to_regclass('coverage_bindings') IS NOT NULL AND to_regclass('request_jobs') IS NOT NULL AND to_regclass('forwarding_links') IS NOT NULL AND to_regclass('forwarded_files') IS NOT NULL AND to_regclass('inbound_replies') IS NOT NULL AND to_regclass('vendor_credit_postings') IS NOT NULL AND to_regclass('operations_alert_deliveries') IS NOT NULL AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='preparation_intakes' AND column_name='agent_checkpoint') AND to_regclass('quickbooks_entity_syncs') IS NOT NULL AND to_regclass('quickbooks_snapshots') IS NOT NULL AND to_regclass('quickbooks_connections') IS NOT NULL AND to_regclass('production_postings') IS NOT NULL AND to_regclass('production_posting_grants') IS NOT NULL AND to_regclass('close_preparations') IS NOT NULL AND to_regclass('email_outbox') IS NOT NULL AND to_regclass('current_client_access') IS NOT NULL AND to_regclass('current_organization_members') IS NOT NULL AND to_regclass('close_deletion_receipts') IS NOT NULL AND to_regclass('recovery_actions') IS NOT NULL AND to_regclass('procedure_versions') IS NOT NULL AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='procedure_drafts' AND column_name='engine') AND to_regclass('close_scopes') IS NOT NULL AND to_regclass('close_signoffs') IS NOT NULL AND to_regclass('organizations') IS NOT NULL AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='client_closes' AND column_name='organization_id') AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='client_closes' AND column_name='retain_until') AND to_regclass('client_closes') IS NOT NULL AND to_regclass('workpapers') IS NOT NULL AND to_regclass('sandbox_postings') IS NOT NULL AND to_regclass('evidence') IS NOT NULL AND to_regclass('preparation_plans') IS NOT NULL AND to_regclass('preparation_jobs') IS NOT NULL AND to_regclass('workpaper_review_state') IS NOT NULL AND position('recurring_accrual' in pg_get_viewdef('workpaper_review_state'::regclass))>0 AND to_regclass('request_drafts') IS NOT NULL AND to_regclass('work_replies') IS NOT NULL AND to_regclass('client_request_links') IS NOT NULL AND to_regclass('workpaper_source_review_state') IS NOT NULL AND to_regclass('preparation_answers') IS NOT NULL AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='preparation_intakes' AND column_name='agent_claim') AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='evidence' AND column_name='extraction_state')")" = t
      - name: Deploy isolated on-demand text scanner
        run: |
          export CLOSE_SCANNER_SECRET_FILE="$(mktemp)"
          trap 'rm -f "$CLOSE_SCANNER_SECRET_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.CLOSE_SCANNER_SECRET_FILE, JSON.stringify({UPLOAD_SCAN_KEY: process.env.UPLOAD_SCAN_KEY}), {mode: 0o600});
          JS
          npx wrangler deploy -c workers/scanner/wrangler.jsonc --secrets-file "$CLOSE_SCANNER_SECRET_FILE"
      - name: Deploy code and server secrets together
        run: |
          export CLOSE_DEPLOY_SECRET_FILE="$(mktemp)"
          trap 'rm -f "$CLOSE_DEPLOY_SECRET_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const names = ['TEXT_SCANNER_URL','UPLOAD_SCAN_HOST','UPLOAD_SCAN_KEY','EMAIL_INTAKE_ADDRESS','EMAIL_INTAKE_KEY','QBO_CLIENT_ID','QBO_CLIENT_SECRET','QBO_REDIRECT_URI','QBO_WEBHOOK_VERIFIER','QBO_PRODUCTION_CLIENT_ID','QBO_PRODUCTION_CLIENT_SECRET','QBO_PRODUCTION_REDIRECT_URI','XERO_CLIENT_ID','XERO_CLIENT_SECRET','XERO_REDIRECT_URI','SECRETS_KEY','PUBLIC_APP_URL','DATABASE_URL','WORKOS_CLIENT_ID','WORKOS_ORGANIZATION_ID','WORKOS_ISSUER','FRONTEND_ORIGIN','OPENAI_API_KEY','OPENAI_MODEL','QBO_SANDBOX_REALM_ID','QBO_SANDBOX_ENTITY','QBO_SANDBOX_PREPAID_ACCOUNT_ID','QBO_SANDBOX_EXPENSE_ACCOUNT_ID','QBO_SANDBOX_ACCESS_TOKEN'];
          writeFileSync(process.env.CLOSE_DEPLOY_SECRET_FILE, JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name] || '']))), {mode: 0o600});
          JS
          npm run deploy:staging -- --secrets-file "$CLOSE_DEPLOY_SECRET_FILE" --route "${UPLOAD_SCAN_HOST}/*"
      - name: Deploy background worker with scoped server configuration
        run: |
          export CLOSE_WORKER_SECRET_FILE="$(mktemp)"
          trap 'rm -f "$CLOSE_WORKER_SECRET_FILE"' EXIT
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.CLOSE_WORKER_SECRET_FILE, JSON.stringify({DATABASE_URL: process.env.DATABASE_URL, SECRETS_KEY: process.env.SECRETS_KEY || '', OPENAI_API_KEY: process.env.OPENAI_API_KEY || '', OPENAI_MODEL: process.env.OPENAI_MODEL || '', OPERATIONS_ALERT_WEBHOOK_URL: process.env.OPERATIONS_ALERT_WEBHOOK_URL || '', OPERATIONS_ALERT_WEBHOOK_TOKEN: process.env.OPERATIONS_ALERT_WEBHOOK_TOKEN || '', QBO_CLIENT_ID: process.env.QBO_CLIENT_ID || '', QBO_CLIENT_SECRET: process.env.QBO_CLIENT_SECRET || '', QBO_REDIRECT_URI: process.env.QBO_REDIRECT_URI || '', PUBLIC_APP_URL: process.env.PUBLIC_APP_URL || '', UPLOAD_SCAN_KEY: process.env.UPLOAD_SCAN_KEY || '', TEXT_SCANNER_URL: process.env.TEXT_SCANNER_URL || ''}), {mode: 0o600});
          JS
          npx wrangler deploy -c workers/queue/wrangler.jsonc --secrets-file "$CLOSE_WORKER_SECRET_FILE"
      - name: Verify staging readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 "${STAGING_URL%/}/readyz"

name: Inspect or remove Cloudflare credential bindings
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production
      plan:
        description: 'Non-secret JSON deletion plan: Worker names, inspected deployment IDs and credential names only. Empty means inspect.'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect metadata or apply the reviewed deletion plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREDENTIAL_MAINTENANCE_ENV: ${{ inputs.environment }}
          CREDENTIAL_MAINTENANCE_PLAN: ${{ inputs.plan }}
        run: node scripts/cloudflare-credential-maintenance.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.plan == ''
        with:
          name: cloudflare-credential-metadata
          path: credential-metadata.json
          retention-days: 1

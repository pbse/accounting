name: CI
# Pull requests are checked here. Deploy production does not run this again: it deploys a merge only when the pull
# request's own run of this workflow passed. Deploy staging still calls it.
on:
  pull_request:
    # Documentation changes alone need no checks and no deploy.
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels its older run; a deploy's run has a group of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://close:test-only@127.0.0.1:5432/close_test?sslmode=disable
      WORKSPACE_TOKEN: ci-configuration-validation-only-00000000
      # As the container images build it, so Go that only builds with cgo fails here, not in the deploy.
      CGO_ENABLED: "0"
    # Billing rounds each job up to the minute, so slow independent work runs side by side: PostgreSQL, the PDF/OCR
    # tools, the Go checks and the TypeScript checks each start in the background, are waited for, and must pass.
    # Each writes its exit status even when it fails (set +e), so a wait never ends in a silent timeout.
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit and its parent: a pull request's merge commit, to see what the pull request changes.
          fetch-depth: 2
      - name: Select context-machine integration checks
        id: context
        # Keep the full Go suite on every PR. Only skip the CLI/image check when
        # the changed sources cannot affect the hosted runtime or its dependencies.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- services/backend services/context-machine workers/context-machine infra/postgres scripts/deploy-context-machine.mjs scripts/deploy-context-machine.test.mjs .dockerignore package-lock.json .github/workflows/ci.yml; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select the browser layout check
        id: layout
        # Both apps in a browser costs a minute or two, so it runs when what the pages are made of changes.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- apps packages scripts/layout-check.mjs package.json package-lock.json .github/workflows/ci.yml; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start PostgreSQL and install PDF/OCR tools in the background
        # The Go tests mostly wait on commits, so this throwaway database does not sync them to disk.
        run: |
          (set +e; docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=close -e POSTGRES_PASSWORD=test-only -e POSTGRES_DB=close_test postgres:17-alpine -c fsync=off -c synchronous_commit=off -c full_page_writes=off) > /tmp/postgres.log 2>&1 &
          (set +e; sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng; echo $? > /tmp/apt.status) > /tmp/apt.log 2>&1 &
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          # PR-scoped caches still reuse compilation on later pushes to the same PR.
          cache: true
          cache-dependency-path: services/backend/go.sum
      - name: Migrations, Go tests and vet in the background
        # Packages share PostgreSQL; global worker claims can consume another package's fixtures.
        # The migration runner is applied twice: the second run must apply nothing. go test skips its own vet pass,
        # since go vet runs in full afterwards.
        run: |
          (set +e
           timeout 120 sh -c 'until pg_isready -q -h 127.0.0.1 -U close -d close_test; do sleep 1; done' &&
           DATABASE_URL="$TEST_DATABASE_URL" infra/postgres/migrate.sh &&
           again=$(DATABASE_URL="$TEST_DATABASE_URL" infra/postgres/migrate.sh) && test -z "$again" &&
           timeout 300 sh -c 'until [ -f /tmp/apt.status ]; do sleep 1; done' && test "$(cat /tmp/apt.status)" = 0 &&
           cd services/backend && go test -count=1 -p 1 -vet=off ./... && go vet ./...
           echo $? > /tmp/go.status) > /tmp/go.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: TypeScript checks, tests, builds and Worker bundles
        # The app builds run vite directly: `npm run check` has already type-checked every workspace.
        run: |
          npm run check
          npm test
          npm exec -w @close/frontend -- vite build
          npm exec -w @close/admin -- vite build
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/edge/wrangler.jsonc
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/queue/wrangler.jsonc
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/scanner/wrangler.jsonc
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/context-machine/wrangler.jsonc
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/context-machine/wrangler.jsonc --env production
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/edge/wrangler.jsonc --env production
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/queue/wrangler.jsonc --env production
          CONTEXT_MACHINE_ENABLED=false node scripts/deploy-context-machine.mjs --prepare-callers
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/edge/wrangler.jsonc --env production
          npx wrangler deploy --dry-run --containers-rollout=none -c workers/queue/wrangler.jsonc --env production
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Both apps in a browser, when the front end changes
        if: steps.layout.outputs.check == 'true'
        # A database of its own beside the Go tests', the API built from this commit and both apps' dev servers; then
        # scripts/layout-check.mjs walks every page in the runner's Chrome (docs/design-system.md), adding its synthetic
        # firm to that database (DATABASE_URL).
        env:
          DATABASE_URL: postgres://close:test-only@127.0.0.1:5432/close_layout?sslmode=disable
        run: |
          trap 'kill $(jobs -p) 2> /dev/null' EXIT
          timeout 120 sh -c 'until pg_isready -q -h 127.0.0.1 -U close -d close_test; do sleep 1; done'
          docker exec postgres createdb -U close close_layout
          infra/postgres/migrate.sh > /dev/null
          (cd services/backend && go build -o /tmp/api ./cmd/api)
          HTTP_ADDR=127.0.0.1:8080 /tmp/api > /tmp/api.log 2>&1 &
          npm run dev -w @close/frontend > /tmp/frontend.log 2>&1 &
          npm run dev -w @close/admin > /tmp/admin.log 2>&1 &
          timeout 120 sh -c 'until curl -sf http://127.0.0.1:8080/readyz > /dev/null && curl -sf http://127.0.0.1:5173/ > /dev/null && curl -sf http://127.0.0.1:5174/admin/ > /dev/null; do sleep 1; done'
          npm run check:layout || { tail -n 40 /tmp/api.log /tmp/frontend.log /tmp/admin.log; exit 1; }
      - run: test -z "$(gofmt -l services/backend)"
      - run: docker compose config --quiet
      - name: Migrations, Go tests and vet passed
        run: |
          timeout 600 sh -c 'until [ -f /tmp/go.status ]; do sleep 1; done' || true
          cat /tmp/go.log
          test "$(cat /tmp/go.status 2>/dev/null)" = 0 || { cat /tmp/postgres.log /tmp/apt.log; exit 1; }
      - name: Workflow registry matches the workflow directories
        run: cd services/backend && go generate ./workflows && git diff --exit-code -- workflows/registry_gen.go
      - name: The scanner's Go packages are the ones Deploy production watches
        run: |
          cd services/backend
          test "$(go list -deps ./cmd/scanner | grep '^close.local/' | sort | tr '\n' ' ')" = "close.local/backend/cmd/scanner close.local/backend/internal/scanning " ||
            { echo "::error::cmd/scanner now uses other packages; add them to the scanner paths in deploy-production.yml and here."; exit 1; }
      - name: Container images build, when a Dockerfile or the Go modules change
        # Otherwise the Go build above covers the code, and every deploy builds the images again.
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD) || changed=Dockerfile
          if grep -qE '(^|/)(Dockerfile|\.dockerignore)$|^services/backend/go\.(mod|sum)$' <<<"$changed"; then
            docker build -t close-backend services/backend
            docker build -t close-text-scanner -f services/scanner/Dockerfile .
          else
            echo "No Dockerfile or Go module change."
          fi
      - name: Gateway and runtime race checks with coverage
        if: steps.context.outputs.check == 'true'
        run: cd services/backend && CGO_ENABLED=1 go test -count=1 -race -cover ./internal/llm/...
      - name: Context-machine image and real CLI protocol smoke tests
        if: steps.context.outputs.check == 'true'
        run: |
          docker build -t close-context-machine -f services/context-machine/Dockerfile .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C services/backend test -c -o /tmp/machine.test ./internal/llm/machine
          docker run --rm --entrypoint /tmp/machine.test -e CONTEXT_MACHINE_CLI_SMOKE=1 -v /tmp/machine.test:/tmp/machine.test:ro close-context-machine -test.run 'TestInstalled.*CLIs' -test.v
